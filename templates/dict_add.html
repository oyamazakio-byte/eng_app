<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<title>{{ title }} 追加</title>

<style>

body{
    font-family:sans-serif;
    padding:20px;
}

input{
    font-size:20px;
    padding:8px;
    width:320px;
    margin-bottom:12px;
}

button{
    font-size:20px;
    padding:8px 18px;
}

.error{
    color:red;
    margin-bottom:20px;
}

.back{
    margin-top:20px;
}

</style>

</head>

<body>

<h1>{{ title }} 追加</h1>

{% if error %}

<div class="error">

{{ error }}

</div>

{% endif %}

<form method="post">

<p>

<input
    type="text"
    name="key"
    placeholder="KEY"
>

</p>

<p>

<input
    type="text"
    name="kana"
    placeholder="VALUE"
>

</p>

<button type="submit">

追加

</button>

</form>

<div class="back">

<a href="/eng/dict/{{ dict_type }}">

← 戻る

</a>

</div>

</body>
</html>
