<h1 style="
font-size:42px;
margin:20px 0;
">
一般英語追加
</h1>

<div id="loading" style="display:none;position:fixed;top:120px;left:0;width:100%;font-size:42px;font-weight:bold;color:red;background:yellow;padding:30px;text-align:center;z-index:99999;">
<div id="loadingText">
📝 一般英語解析待機中...
</div>
<div style="font-size:22px;margin-top:10px;color:#555;">
しばらくお待ちください
</div>
</div>

<form id="generalForm" method="POST" action="/eng/general_import">

<div style="
font-size:28px;
font-weight:bold;
margin-bottom:10px;
">
会話タイトル
</div>

<input
type="text"
name="conv_title"
placeholder="例: get の使い方"
style="
width:100%;
font-size:28px;
padding:18px;
margin-bottom:25px;
box-sizing:border-box;
border:4px solid #333;
border-radius:12px;
background:white;
">
<div style="
font-size:28px;
font-weight:bold;
margin-bottom:10px;
">
サブカテゴリ
</div>

<select
name="subcategory"
style="
width:100%;
font-size:28px;
padding:18px;
margin-bottom:25px;
box-sizing:border-box;
">

<option value="短文">
📘 短文
</option>

<option value="長文">
📘 長文
</option>

</select>

<div style="
font-size:28px;
font-weight:bold;
margin-bottom:10px;
">
英文
</div>

<textarea
name="english_text"
placeholder="ここに英文を入力"
style="
width:100%;
height:400px;
font-size:28px;
padding:20px;
box-sizing:border-box;
border:4px solid #333;
border-radius:12px;
background:white;
"></textarea>
<br><br>

<button
type="button" id="submitBtn" onclick="startGeneralImport()"
style="
font-size:32px;
padding:20px;
width:100%;
background:#4CAF50;
color:white;
border:none;
border-radius:12px;
">

一般英語取り込み

</button>

</form>

<br>

<a href="/eng/"
style="
display:block;
font-size:32px;
padding:20px;
background:#4CAF50;
color:white;
text-align:center;
border-radius:12px;
text-decoration:none;
">

← 戻る

</a>
<script>

function startGeneralImport(){

    document.getElementById(
        "loading"
    ).style.display = "block";

    const btn =
        document.getElementById(
            "submitBtn"
        );

    btn.disabled = true;

    btn.innerText =
        "変換中...";

    startGeneralLoadingSteps();

    setTimeout(() => {

        document.getElementById(
            "generalForm"
        ).submit();

    }, 5000);
}

function startGeneralLoadingSteps(){

    const loadingText =
        document.getElementById(
            "loadingText"
        );

    const steps = [

        "📝 一般英語解析中...",
        "🧠 AIカタカナ変換中...",
        "🌐 AI翻訳生成中...",
        "💾 データ保存中...",
        "📘 学習画面を作成しています..."

    ];

    let index = 0;

    loadingText.innerText =
        steps[0];

    const interval = setInterval(() => {

        index++;

        if(index >= steps.length){

            clearInterval(interval);

            return;
        }

        loadingText.innerText =
            steps[index];

    }, 1200);
}

</script>
