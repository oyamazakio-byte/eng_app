<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>登場人物設定</title>

<style>
body {
    margin: 20px;
    font-family: sans-serif;
    background: #f5f5f5;
}

h1 {
    font-size: 50px;
    text-align: center;
    margin-bottom: 30px;
}

.character {
    background: white;
    padding: 20px;
    margin-bottom: 15px;
    border-radius: 12px;
}

.character label {
    display: block;
    font-size: 32px;
    font-weight: bold;
    margin-bottom: 10px;
}

.character input {
    width: 100%;
    box-sizing: border-box;
    font-size: 30px;
    padding: 12px;
    border: 2px solid #ccc;
    border-radius: 8px;
}

button,
.back {
    display: block;
    width: 100%;
    box-sizing: border-box;
    font-size: 32px;
    padding: 18px;
    border: none;
    border-radius: 12px;
    margin-top: 20px;
    text-align: center;
    text-decoration: none;
}

button {
    background: #4CAF50;
    color: white;
}

.back {
    background: #607D8B;
    color: white;
}

@media screen and (max-width: 600px) {
    body {
        margin: 10px;
    }

    h1 {
        font-size: 40px;
    }

    .character label {
        font-size: 28px;
    }

    .character input {
        font-size: 26px;
    }

    button,
    .back {
        font-size: 26px;
        padding: 16px;
    }
}
</style>
</head>

<body>

<h1>👥 登場人物設定</h1>

<form method="post">

<div class="character">
    <label>A</label>
    <input type="text" name="A" value="{{ characters.get('A', '') }}" placeholder="例：Gordon">
</div>

<div class="character">
    <label>B</label>
    <input type="text" name="B" value="{{ characters.get('B', '') }}" placeholder="例：Shingo">
</div>

<div class="character">
    <label>C</label>
    <input type="text" name="C" value="{{ characters.get('C', '') }}" placeholder="例：店員">
</div>

<div class="character">
    <label>D</label>
    <input type="text" name="D" value="{{ characters.get('D', '') }}" placeholder="例：友人">
</div>

<div class="character">
    <label>E</label>
    <input type="text" name="E" value="{{ characters.get('E', '') }}" placeholder="例：案内人">
</div>

<button type="submit">
保存
</button>
</form>

<a
href="/eng/detail_multi/{{ conversation_id }}"
class="back">
⬅ 会話へ戻る
</a>

</body>
</html>
