<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>{{ subcategory }}</title>

<style>
@media screen and (max-width: 600px) {
    body {
        margin: 10px !important;
    }

    h1 {
        font-size: 40px !important;
    }

    a {
        font-size: 26px !important;
        padding: 18px !important;
    }
}
</style>
</head>

<body style="
margin:20px;
font-family:sans-serif;
background:#f5f5f5;
">

<h1 style="
font-size:60px;
text-align:center;
margin-bottom:35px;
">
🎭 {{ subcategory }}
</h1>

{% if months %}

{% for month in months %}

<a href="/eng/?category=ロールプレイ&subcategory={{ subcategory|urlencode }}&year_month={{ month.year_month|urlencode }}"
style="
display:block;
font-size:40px;
padding:25px;
background:#2196F3;
color:white;
text-align:center;
border-radius:15px;
margin-bottom:20px;
text-decoration:none;
">
{{ month.year_month[:4] }}年{{ month.year_month[5:7]|int }}月
</a>

{% endfor %}

{% else %}

<div style="
font-size:30px;
background:white;
padding:30px;
border-radius:15px;
text-align:center;
">
まだ登録されている年月はありません。
</div>

{% endif %}

<a href="/eng/roleplay"
style="
display:block;
font-size:32px;
padding:18px;
background:#607D8B;
color:white;
text-align:center;
border-radius:15px;
margin-top:35px;
text-decoration:none;
">
⬅ ロールプレイへ戻る
</a>

</body>
</html>
